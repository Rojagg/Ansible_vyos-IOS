ansible_user: cisco04

interfaces:
  - name: GigabitEthernet0/1
    ipv4: 
    - address: 10.0.24.2/24

  - name: GigabitEthernet0/0
    ipv4:
      - address: 10.0.34.1/24

  - name: Loopback0
    ipv4: 
    - address: 10.0.0.4/32

ospf:
  process_id: 1
  networks:
    - prefix: 10.0.24.2
      wildcard: 0.0.0.0
      area: 0

    - prefix: 10.0.34.1
      wildcard: 0.0.0.0
      area: 0
